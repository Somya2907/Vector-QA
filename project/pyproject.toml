[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vector-qa"
version = "0.1.0"
description = "Permission-Aware Vector QA System"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "app*"]

[tool.setuptools.package-dir]
"" = "."
